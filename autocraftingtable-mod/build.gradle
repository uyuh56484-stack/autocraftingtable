plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '1.0.17'
}

version = '1.1.0'
group = 'com.example'
base { archivesName = 'autocraftingtable' }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

neoForge {
    version = project.neo_version
    mods {
        autocraftingtable { sourceSet sourceSets.main }
    }
}
