name: Build Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with detailed logs
        run: ./gradlew build --no-daemon --stacktrace
        # Для Windows пользователей (если вдруг будешь запускать локально) команда будет gradlew.bat build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autocraftingtable-mod
          path: build/libs/*.jar
