name: Build Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Самое важное: скачиваем твой код на сервер GitHub
      - name: Checkout code
        uses: actions/checkout@v5

      # 2. Ставим Java 21 (обязательно для NeoForge/Fabric новых версий)
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3. Настраиваем Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Запускаем сборку. 
      # ВАЖНО: Используем ./gradlew, так как это надежнее, чем просто gradle.
      # Если сборка упадет с ошибкой "Permission denied", значит, у файла gradlew нет прав,
      # но сначала попробуем так.
      - name: Build with detailed logs
        run: gradlew build --no-daemon --stacktrace

      # 5. Сохраняем результат (твой .jar файл)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autocraftingtable-mod
          path: build/libs/*.jar
