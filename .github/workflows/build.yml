name: Build Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autocraftingtable-mod

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: gradlew build --no-daemon --stacktrace

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autocraftingtable-mod
          path: autocraftingtable-mod/build/libs/*.jar
